<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11131a">
<meta name="robots" content="noindex">
<title>Ballpark · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="base.css?v=202611130834">
<link rel="stylesheet" href="forms.css?v=202611130834">
<link rel="stylesheet" href="widgets.css?v=202611130834">
<link rel="stylesheet" href="lab.css?v=202611130834">
<style>
  .app { max-width: 760px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { border: 0; background: var(--panel); color: var(--muted); border-radius: 999px; padding: 9px 14px; font-weight: 700; cursor: pointer; }
  .tabs button.on { background: var(--ink); color: var(--bg); }
  .tabs .count { opacity: .6; margin-left: 4px; }
  .set { background: var(--panel); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; }
  .set .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .set .head b { font-size: 17px; }
  .set .meta { color: var(--muted); font-size: 14px; }
  .set ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
  .set li { font-size: 15px; line-height: 1.35; }
  .set li .ans { color: var(--gold); font-weight: 700; }
  .set li .sub { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button { border: 0; background: var(--panel-2); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .actions button.danger { color: var(--danger); }
  .actions button:disabled { opacity: .35; cursor: default; }
  .players { display: flex; flex-wrap: wrap; gap: 6px; }
  .players span { background: var(--panel-2); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
  .players span b { color: var(--mint); font-variant-numeric: tabular-nums; }
  .players button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 6px; }
  .pill { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .pill.today { color: var(--bg); background: var(--mint); }
  .empty { color: var(--muted); text-align: center; padding: 24px; }
  .editbar { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 20px 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px; }
  .try-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .try-song { border: 0; background: var(--panel-2); color: var(--ink); border-radius: 12px; padding: 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
  .try-song span { color: var(--muted); font-size: 13px; }
  .try-song { position: relative; }
  .try-del { position: absolute; top: 6px; right: 6px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; }
  .try-phone { max-width: 420px; justify-self: center; width: 100%; }
  .try-phone .qn { color: var(--accent); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
  .try-phone .prompt { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .try-result { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; text-align: center; }
  .try-result div { background: var(--panel-2); border-radius: 12px; padding: 10px 6px; display: grid; gap: 4px; font-size: 13px; }
  .try-result b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .try-result .pts { color: var(--mint); }
  .tl { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .tl-lbl { fill: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .tl-beat { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  .tl-tap { fill: var(--mint); }
  .tl-link { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
  .tl-verdict { font-size: 14px; text-align: center; margin: 0; }
  label.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
  label.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.use-set { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.use-head { font-size: 14px; color: var(--muted); }
.use-q { text-align: left; border: 0; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
.use-q:hover { outline: 2px solid var(--accent); }
.try-song.on { outline: 2px solid var(--accent); }
.lab-card #labPlay { display: grid; gap: 10px; justify-items: center; margin: 8px 0 14px; }
.lab-points { text-align: center; font-size: 40px; font-weight: 800; color: var(--mint); }
.lab-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 10px 0; }
.lab-metrics div { background: var(--panel-2); border-radius: 12px; padding: 10px; display: grid; gap: 2px; text-align: center; font-size: 14px; }
.lab-settings, .lab-raw { margin-top: 14px; } .lab-settings summary, .lab-raw summary { cursor: pointer; color: var(--muted); font-weight: 700; }
.lab-settings .field { margin: 10px 0; }
.lab-raw pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; color: var(--muted); max-height: 160px; overflow: auto; }
/* Spoiler toggle: answers blurred until you tap them */
.spoil-btn { border: 0; background: var(--panel-2); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 700; cursor: pointer; font-size: 13px; }
.no-spoilers .set .ans, .no-spoilers .set .sub, .no-spoilers .set .players, .no-spoilers .use-set .ans,
.no-spoilers #editor [data-part], .no-spoilers #editor [data-f="more"], .no-spoilers #preview { filter: blur(8px); cursor: pointer; transition: filter .15s; user-select: none; }
.no-spoilers .peek, .no-spoilers .peek [data-part], .no-spoilers .peek [data-f="more"] { filter: none !important; user-select: auto; }
.no-spoilers #editor .card:not(.peek) [data-part] * , .no-spoilers #editor .card:not(.peek) [data-f="more"] * { pointer-events: none; }
.peek-hint { display: none; font-size: 13px; color: var(--muted); }
.no-spoilers .peek-hint { display: block; }
/* Moving questions */
.set li { position: relative; }
.swap-btn { border: 0; background: var(--panel-2); color: var(--muted); border-radius: 8px; padding: 2px 8px; font-size: 12px; cursor: pointer; margin-left: 6px; }
.swap-card { border: 2px solid var(--accent); }
.swap-card .use-q.from { outline: 2px dashed var(--accent); opacity: .6; cursor: default; }
.rnd-items { margin: 6px 0 2px; font-size: 14px; }
.rnd-items summary { cursor: pointer; color: var(--mint); font-weight: 700; }
.rnd-items ol { margin: 6px 0; padding-left: 1.4em; display: grid; gap: 4px; }
.rnd-items ul { margin: 2px 0; padding-left: 1.1em; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo" id="logo"></div>
    <div style="display:flex;gap:14px;align-items:center"><button type="button" class="spoil-btn" id="spoilBtn"></button><a href="index.html">Screen</a><a href="add.html">Add set</a><a href="#" id="logout" class="hidden">Log out</a></div>
  </div>

  <div id="login" class="card hidden">
    <h1>Quiz admin</h1>
    <label class="field"><span>Password</span><input class="input" id="pass" type="password" autocomplete="current-password"></label>
    <button class="btn block" id="loginBtn">Log in</button>
  </div>

  <div id="main" class="hidden" style="display:grid;gap:16px">
    <div class="tabs" id="tabs"></div>
    <div id="view" style="display:grid;gap:14px"></div>
  </div>

  <div id="edit" class="hidden" style="display:grid;gap:18px">
    <div class="card">
      <h1 id="editTitle">Edit set</h1>
      <p class="hint" id="editHint"></p>
      <label class="field"><span>Author</span><input class="input" id="editAuthor" maxlength="40"></label>
      <label class="check"><input type="checkbox" id="editBackup"> Backup set (only used when the queue is empty)</label>
      <p class="peek-hint">🙈 Answers are hidden. Tap a blurred area to show that question's answers.</p>
    </div>
    <div id="editor" style="display:grid;gap:18px"></div>
    <div class="editbar"><button class="btn ghost" id="cancelEdit">Cancel</button><button class="btn" id="saveEdit">Save</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { CONFIG } from './config.js?v=202611130834';
import { rpc, fmt, fmtDate, esc, swatchHtml, fmtPts, store, rhythmPoints, rhythmVerdict, rhythmTimeline } from './common.js?v=202611130834';
import { createRhythm, createRecorder, PRACTICE_RHYTHM, PRACTICE_WORDS, syllables } from './widgets.js?v=202611130834';
import { createSetEditor } from './editor.js?v=202611130834';
import { LAB, labAnswer } from './lab.js?v=202611130834';

const $ = (id) => document.getElementById(id);
$('logo').innerHTML = `${esc(CONFIG.title)}<span class="ball"></span>`;

let pass = sessionStorage.getItem('bp_admin') || '';
let data = null;
let tab = 'queue';
let editing = null;   // { id | null, ... }

function toast(msg, ok = false) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  if (ok) t.style.background = 'var(--mint)', t.style.color = 'var(--bg)';
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

async function admin(action, args = {}) {
  const r = await rpc('quiz_admin', { p_pass: pass, p_action: action, p_args: args });
  if (r?.error) throw new Error(r.error);
  return r;
}

function show(which) {
  ['login', 'main', 'edit'].forEach((id) => $(id).classList.toggle('hidden', id !== which));
  $('logout').classList.toggle('hidden', which === 'login');
  window.scrollTo(0, 0);
}

// ---------- Login ----------
async function tryLogin() {
  try { await admin('login'); sessionStorage.setItem('bp_admin', pass); await load(); show('main'); }
  catch (e) { sessionStorage.removeItem('bp_admin'); show('login'); if (pass) toast(e.message); }
}
$('loginBtn').onclick = () => { pass = $('pass').value; tryLogin(); };
$('pass').onkeydown = (e) => { if (e.key === 'Enter') $('loginBtn').click(); };
$('logout').onclick = (e) => { e.preventDefault(); pass = ''; sessionStorage.removeItem('bp_admin'); show('login'); };

// ---------- Data + rendering ----------
async function spares(action, args = {}) { return rpc('quiz_admin_spares', { p_pass: pass, p_action: action, p_args: args }); }
async function load() {
  data = await admin('list');
  try { data.spares = await spares('list'); } catch { data.spares = []; }
  render();
}

// A quick round's statements and options, without saying which are right (never blurred).
function roundItems(q) {
  const items = q.kind === 'round' ? q.meta?.items : null;
  if (!items?.length) return '';
  const abc = (a) => a.slice().sort((x, y) => String(x).localeCompare(String(y), 'sv'));
  const opt = (o) => (/^https:\/\//.test(o) ? `<img src="${esc(o)}" alt="" style="width:34px;height:34px;object-fit:cover;border-radius:5px;vertical-align:middle">` : esc(o));
  return `<details class="rnd-items" onclick="event.stopPropagation()"><summary>Show the ${items.length} item${items.length === 1 ? '' : 's'} (no answers)</summary><ol>${items.map((it) =>
    it.t === 'tf' ? `<li>${esc(it.text)}</li>`
    : it.t === 'pick' ? `<li>${esc(it.text)}<ul>${abc(it.options).map((o) => `<li>${opt(o)}</li>`).join('')}</ul></li>`
    : `<li>${esc(it.text)}<div class="muted">${abc(it.pairs.map((x) => x[0])).map(opt).join(' · ')}<br>↔ ${abc(it.pairs.map((x) => x[1])).map(opt).join(' · ')}</div></li>`).join('')}</ol></details>`;
}

function answerText(q) {
  if (LAB[q.kind]) return `${LAB[q.kind].title}${q.meta ? ` · ${esc(labAnswer(q.kind, q.meta) || q.meta.country || q.meta.shape || '')}` : ''}`;
  switch (q.kind) {
    case 'map': return `📍 ${esc(q.label || `${q.lat?.toFixed(3)}, ${q.lng?.toFixed(3)}`)}`;
    case 'percent': return `${fmt(q.answer)} %`;
    case 'time': return `⏱ ${fmt(q.answer)} s`;
    case 'tempo': return `🥁 ${(q.items || []).length} taps · ${((q.answer || 0) / 1000).toFixed(1)} s · ${q.words?.length ? esc(q.words.join('-')) : `tap: ${esc(q.label || '')}`}`;
    case 'color': return `${swatchHtml(q.color)} ${esc(q.color)}`;
    case 'order': return (q.items || []).map((it, i) => `${i + 1}. ${esc(it)}`).join(' › ');
    default: return `${fmt(q.answer)} ${esc(q.unit || '')}`;
  }
}

function setCard(s, opts) {
  const movable = !s.play_date && !s.played;
  const qs = s.questions.map((q) => `<li>${esc(q.prompt)}${movable ? `<button type="button" class="swap-btn" data-swap="${q.id}" title="Swap with a question in another set">⇄ Move</button>` : ''}<br><span class="ans">${answerText(q)}</span>${roundItems(q)}
    ${q.fact ? `<span class="sub"> · ${esc(q.fact)}</span>` : ''}${q.source_url ? ` <a class="sub" href="${esc(q.source_url)}" target="_blank" rel="noopener">source</a>` : ''}${q.image_url ? ' <span class="sub">· 🖼 image</span>' : ''}</li>`).join('');
  return `<div class="set" data-id="${s.id}">
    <div class="head"><b>${opts.title}</b><span class="meta">${opts.meta || ''}</span></div>
    <ol>${qs}</ol>
    ${opts.players ?? ''}
    <div class="actions">${opts.actions}</div>
  </div>`;
}

function render() {
  const today = data.today;
  const counts = { queue: data.queue.length, days: data.days.length, backups: data.backups.length };
  $('tabs').innerHTML = [['queue', 'Queue'], ['days', 'Today & past'], ['backups', 'Backups'], ['try', 'Try it'], ['settings', 'Settings']]
    .map(([k, l]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${l}${counts[k] !== undefined ? `<span class="count">${counts[k]}</span>` : ''}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { tab = b.dataset.t; render(); });

  let html = '';
  if (tab === 'queue') {
    html = `<div class="actions"><button data-a="new">＋ New set</button></div>` + (data.queue.length ? data.queue.map((s, i) => setCard(s, {
      title: `#${i + 1} · ${esc(s.author)}`,
      meta: `runs ${fmtDate(s.expected_date, { weekday: 'short', day: 'numeric', month: 'short' })}`,
      actions: `<button data-a="edit">Edit</button>
        <button data-a="up" ${i === 0 ? 'disabled' : ''}>↑</button><button data-a="down" ${i === data.queue.length - 1 ? 'disabled' : ''}>↓</button>
        <button data-a="top" ${i === 0 ? 'disabled' : ''}>Play next</button>
        <button data-a="to-backup">Make backup</button><button data-a="delete" class="danger">Delete</button>`,
    })).join('') : `<div class="empty">The queue is empty. Backup sets are used until someone adds a set.</div>`);
  } else if (tab === 'days') {
    html = data.days.length ? data.days.map((s) => {
      const isToday = s.play_date === today;
      const players = s.players.length
        ? `<div class="players">${s.players.map((p) => `<span>${esc(p.player)} <b>${fmt(p.total)}</b><button title="Remove these answers" data-a="del-sub" data-sub="${p.id}" data-name="${esc(p.player)}">✕</button></span>`).join('')}</div>`
        : '<div class="hint">Nobody has answered yet.</div>';
      return setCard(s, {
        title: `${fmtDate(s.play_date)} ${isToday ? '<span class="pill today">Today</span>' : ''}`,
        meta: `by ${esc(s.author)}${s.is_backup ? ' · backup' : ''}`,
        players,
        actions: `<button data-a="edit">${s.played ? 'Fix answers' : 'Edit'}</button>
          ${isToday && !s.players.length ? '<button data-a="unschedule">Put back in queue</button>' : ''}`,
      });
    }).join('') : '<div class="empty">Nothing has been played yet.</div>';
  } else if (tab === 'try') {
    html = `<div class="card"><h2>New challenge types <span class="tag">testing</span></h2>
      <p class="hint">Not in the quiz yet. Play them like a player would, then tweak the settings until the scoring feels fair.</p>
      <div class="try-list" id="labList">${Object.entries(LAB).map(([k, c]) => `<div class="try-song" data-lab="${k}"><b>${c.title}</b></div>`).join('')}</div>
    </div>
    <div id="labArea"></div>
    <div class="card"><h2>Try tap the rhythm</h2>
      <p class="hint">Test the rhythm question exactly as players see it. Nothing is saved to the quiz and nobody gets points.</p>
      <div class="try-list" id="tryList"></div>
    </div>
    <div class="card"><h2>Record a song to test</h2>
      <p class="hint">Start the song on Spotify or YouTube, then tap along with the part you want (for example one tap per syllable of the chorus line). Saved on this device only.</p>
      <label class="field"><span>Song</span><input class="input" id="trySong" placeholder="e.g. Wind of Change – Scorpions"></label>
      <div class="row2"><label class="field"><span>Sung words, with dashes (or leave empty)</span><input class="input" id="tryWords" placeholder="e.g. Stay-in' a-live"></label>
      <label class="field"><span>…or what to tap</span><input class="input" id="tryHint" placeholder="e.g. The whistling at the very start"></label></div>
      <div id="tryRecorder"></div>
      <button type="button" class="btn" id="trySave">Save and test it</button>
    </div>
    <div id="tryArea"></div>`;
  } else if (tab === 'backups') {
    html = `<p class="hint">Backup sets are picked at random on days when the queue is empty. Each is used once.</p>
      <div class="actions"><button data-a="new-backup">＋ New backup set</button></div>` +
      (data.spares?.length ? `<div class="set" id="spareCard"><div class="head"><b>Spare questions</b><span class="meta">${data.spares.length} waiting</span></div>
        <p class="hint">Questions that aren't in a set. Put one into a set (the question it replaces becomes a spare), or tick up to three and make them into a backup set.</p>
        <ol style="list-style:none;padding:0">${data.spares.map((sp) => `<li><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" class="spare-pick" value="${sp.id}" style="margin-top:4px">
          <span>${esc(sp.question.prompt)}<button type="button" class="swap-btn" data-spare-use="${sp.id}">⇄ Put in a set</button><br><span class="ans">${answerText(sp.question)}</span>${sp.note ? `<span class="sub"> · ${esc(sp.note)}</span>` : ''}${roundItems(sp.question)}</span></label></li>`).join('')}</ol>
        <div class="actions"><button data-a="spare-set">Make a backup set from the ticked ones</button></div></div>` : '') +
      (data.backups.length ? data.backups.map((s) => setCard(s, {
        title: esc(s.author), meta: 'backup',
        actions: `<button data-a="edit">Edit</button><button data-a="to-queue">Move to queue</button><button data-a="delete" class="danger">Delete</button>`,
      })).join('') : '<div class="empty">No backup sets left.</div>');
  } else {
    html = `<div class="card" id="screenCard"><h2>Office screen</h2><p class="hint">Loading…</p></div>
      <div class="card"><h2>Change admin password</h2>
      <label class="field"><span>New password (at least 8 characters)</span><input class="input" id="newPass" type="password" autocomplete="new-password"></label>
      <button class="btn" id="savePass">Save password</button></div>`;
  }
  if (swapFrom && (tab === 'queue' || tab === 'backups')) html = swapPicker() + html;
  if (spareFrom && tab === 'backups') html = sparePicker() + html;
  $('view').innerHTML = html;
  bindActions();
  bindSwap();
  bindPeek();
}

// ---------- Moving questions between sets ----------
let swapFrom = null;   // id of the question being moved
function swapPicker() {
  const sets = [...data.queue, ...data.backups.filter((s) => !s.played)];
  const from = sets.flatMap((s) => s.questions).find((q) => q.id === swapFrom);
  if (!from) { swapFrom = null; return ''; }
  return `<div class="card swap-card" id="swapCard"><h2>Move “${esc(from.prompt)}”</h2>
    <p class="hint">Pick the question to swap places with. It can be in another set or the same set, in the queue or in the backups.</p>
    ${sets.map((s) => `<div class="use-set"><div class="use-head"><b>${s.is_backup ? 'Backup' : s.expected_date ? fmtDate(s.expected_date, { weekday: 'short', day: 'numeric', month: 'short' }) : 'Queued'}</b> · ${esc(s.author)}</div>
      ${s.questions.map((q, k) => `<button type="button" class="use-q ${q.id === swapFrom ? 'from' : ''}" data-swap-to="${q.id}" ${q.id === swapFrom ? 'disabled' : ''}>${k + 1}. ${KIND_ICON[q.kind] || '❓'} ${esc(q.prompt)}</button>`).join('')}</div>`).join('')}
    ${data.spares?.length ? `<div class="use-set"><div class="use-head"><b>Spare questions</b> · not in any set (the moved question becomes a spare)</div>
      ${data.spares.map((sp) => `<button type="button" class="use-q" data-swap-spare="${sp.id}">${KIND_ICON[sp.question.kind] || '❓'} ${esc(sp.question.prompt)}</button>`).join('')}</div>` : ''}
    <div class="actions"><button data-swap-cancel>Cancel</button></div></div>`;
}
// ---------- Putting a spare question into a set ----------
let spareFrom = null;   // id of the spare being placed
const openSets = () => [...data.queue, ...data.backups.filter((s) => !s.played)];
const setLabel = (s) => (s.is_backup ? 'Backup' : s.expected_date ? fmtDate(s.expected_date, { weekday: 'short', day: 'numeric', month: 'short' }) : 'Queued');
function sparePicker() {
  const sp = data.spares?.find((x) => x.id === spareFrom);
  if (!sp) { spareFrom = null; return ''; }
  return `<div class="card swap-card" id="swapCard"><h2>Put “${esc(sp.question.prompt)}” in a set</h2>
    <p class="hint">Pick the question it should replace. You'll see the set in the editor first, then press Save. The replaced question becomes a spare.</p>
    ${openSets().map((s) => `<div class="use-set"><div class="use-head"><b>${setLabel(s)}</b> · ${esc(s.author)}</div>
      ${s.questions.map((q, k) => `<button type="button" class="use-q" data-spare-to="${s.id}:${k}">${k + 1}. ${KIND_ICON[q.kind] || '❓'} ${esc(q.prompt)}</button>`).join('')}</div>`).join('')}
    <div class="actions"><button data-swap-cancel>Cancel</button></div></div>`;
}
function useSpareAt(spareId, setId, pos) {
  const sp = data.spares.find((x) => x.id === spareId), set = findSet(setId);
  const questions = set.questions.map((q, k) => (k === pos ? sp.question : q));
  spareFrom = null; swapFrom = null;
  openEditor({ ...set, questions });
  editing.replaced = { question: set.questions[pos], note: `replaced by a spare in ${set.author}'s set` };
  editing.spareIds = [spareId];
  toast('Spare question put in the set. Check it, then press Save.', true);
}

function bindSwap() {
  $('view').querySelectorAll('[data-spare-use]').forEach((b) => b.onclick = (e) => { e.preventDefault(); spareFrom = +b.dataset.spareUse; swapFrom = null; render(); $('swapCard')?.scrollIntoView({ behavior: 'smooth' }); });
  $('view').querySelectorAll('[data-spare-to]').forEach((b) => b.onclick = () => { const [id, pos] = b.dataset.spareTo.split(':').map(Number); useSpareAt(spareFrom, id, pos); });
  $('view').querySelectorAll('[data-swap-spare]').forEach((b) => b.onclick = () => {
    const set = openSets().find((s) => s.questions.some((q) => q.id === swapFrom));
    useSpareAt(+b.dataset.swapSpare, set.id, set.questions.findIndex((q) => q.id === swapFrom));
  });
  $('view').querySelectorAll('[data-swap]').forEach((b) => b.onclick = () => { swapFrom = +b.dataset.swap; spareFrom = null; render(); $('swapCard')?.scrollIntoView({ behavior: 'smooth' }); });
  $('view').querySelector('[data-swap-cancel]')?.addEventListener('click', () => { swapFrom = null; spareFrom = null; render(); });
  $('view').querySelectorAll('[data-swap-to]').forEach((b) => b.onclick = async () => {
    try {
      await rpc('quiz_admin_swap', { p_pass: pass, p_a: swapFrom, p_b: +b.dataset.swapTo });
      swapFrom = null; toast('Swapped', true); await load();
    } catch (e) { toast(e.message); }
  });
}

// ---------- Spoilers ----------
let spoilers = true;
try { spoilers = localStorage.getItem('bp_admin_spoilers') !== 'off'; } catch { /* default on */ }
function applySpoilers() {
  document.body.classList.toggle('no-spoilers', !spoilers);
  $('spoilBtn').textContent = spoilers ? '🙈 Hide answers' : '👀 Answers hidden';
  $('spoilBtn').title = spoilers ? 'Blur answers so you can manage sets without spoilers' : 'Answers are blurred: tap one to peek, or tap here to show all';
}
$('spoilBtn').onclick = () => { spoilers = !spoilers; try { localStorage.setItem('bp_admin_spoilers', spoilers ? 'on' : 'off'); } catch { /* ignore */ } applySpoilers(); };
function bindPeek() {   // tap a blurred answer to see just that one
  document.querySelectorAll('.set .ans, .set .sub, .set .players, .use-set .ans').forEach((el) => el.addEventListener('click', () => { if (!spoilers) el.classList.toggle('peek'); }));
}
applySpoilers();

function findSet(id) {
  return [...data.queue, ...data.backups, ...data.days].find((s) => s.id === id);
}

function bindActions() {
  $('view').querySelectorAll('[data-a]').forEach((b) => b.onclick = async () => {
    const card = b.closest('.set');
    const id = card ? +card.dataset.id : null;
    const a = b.dataset.a;
    try {
      if (a === 'new') return openEditor(null, false);
      if (a === 'new-backup') return openEditor(null, true);
      if (a === 'spare-set') {
        const ids = [...document.querySelectorAll('.spare-pick:checked')].map((x) => +x.value);
        if (!ids.length || ids.length > 3) { toast('Tick one to three spare questions'); return; }
        const qs = ids.map((id) => data.spares.find((sp) => sp.id === id).question);
        openEditor(null, true, qs);
        editing.spareIds = ids;
        if (qs.length < 3) toast(`Add ${3 - qs.length} more question${qs.length === 2 ? '' : 's'} to complete the set`, true);
        return;
      }
      if (a === 'edit') return openEditor(findSet(id));
      if (['up', 'down', 'top'].includes(a)) await admin('move', { id, dir: a });
      if (a === 'to-backup') await admin('set_backup', { id, backup: true });
      if (a === 'to-queue') await admin('set_backup', { id, backup: false });
      if (a === 'unschedule') { if (!confirm('Put today’s set back at the front of the queue? Another set will be picked for today.')) return; await admin('unschedule', { id }); }
      if (a === 'delete') { if (!confirm('Delete this set for good?')) return; await admin('delete', { id }); toast('Set deleted', true); }
      if (a === 'del-sub') { if (!confirm(`Remove ${b.dataset.name}'s answers for this day?`)) return; await admin('delete_submission', { id: +b.dataset.sub }); toast('Answers removed', true); }
      await load();
    } catch (e) { toast(e.message); }
  });
  if ($('screenCard')) loadScreenCard();
  if ($('tryList')) setupTry();
  if ($('labList')) $('labList').querySelectorAll('[data-lab]').forEach((b) => b.onclick = () => {
    $('labList').querySelectorAll('.try-song').forEach((x) => x.classList.toggle('on', x === b));
    openLab(b.dataset.lab);
  });
  const sp = $('savePass');
  if (sp) sp.onclick = async () => {
    try { await admin('set_password', { new: $('newPass').value }); pass = $('newPass').value; sessionStorage.setItem('bp_admin', pass); toast('Password changed', true); $('newPass').value = ''; }
    catch (e) { toast(e.message); }
  };
}

// ---------- Try it: tap the rhythm sandbox ----------
const TRY_KEY = 'bp_try_rhythms';
// Written from the sheet music (all public domain tunes). Beats -> ms at a comfortable speed; speed doesn't affect scoring.
const beats = (b, ms) => b.map((x) => Math.round(x * ms));
const BUILT_INS = [
  { title: 'Små grodorna (the practice tune)', song: 'Små grodorna', words: PRACTICE_WORDS, hint: '', rhythm: PRACTICE_RHYTHM, builtIn: true, practice: true },
  { title: 'Tetris theme (Game Boy "Type A")', song: 'the Tetris theme (the classic Game Boy "Type A" music)',
    hint: 'The whole first line: du, du-du-du, du-du-du, du-du-du, du-du-du, du du du du du du',
    rhythm: beats([0, 1, 1.5, 2, 3, 3.5, 4, 5, 5.5, 6, 7, 7.5, 8, 9.5, 10, 11, 12, 13, 14], 330), builtIn: true },
  { title: 'Nokia ringtone', song: 'the Nokia ringtone', hint: 'The classic Nokia ringtone, once through', rhythm: beats([0, 0.5, 1, 2, 3, 3.5, 4, 5, 6, 6.5, 7, 8, 9], 360), builtIn: true },
  { song: 'Jingle Bells', words: syllables('Jin-gle bells jin-gle bells jin-gle all the way'), hint: '', rhythm: beats([0, 1, 2, 4, 5, 6, 8, 9, 10, 11.5, 12], 450), builtIn: true },
];
const loadTries = () => { try { return JSON.parse(store.get(TRY_KEY) || '[]'); } catch { return []; } };
const saveTries = (list) => store.set(TRY_KEY, JSON.stringify(list));

function setupTry() {
  const renderList = () => {
    const list = [...BUILT_INS, ...loadTries()];
    $('tryList').innerHTML = list.map((t, i) => `<div class="try-song" data-i="${i}"><b>${esc(t.title || t.song)}</b><span>${t.rhythm.length} taps · ${(t.rhythm[t.rhythm.length - 1] / 1000).toFixed(1)} s</span>${t.builtIn ? '' : `<button type="button" class="try-del" data-del="${i - BUILT_INS.length}" title="Remove">✕</button>`}</div>`).join('');
    $('tryList').querySelectorAll('.try-song').forEach((el) => el.onclick = (e) => {
      if (e.target.dataset.del !== undefined) { const l = loadTries(); l.splice(+e.target.dataset.del, 1); saveTries(l); renderList(); return; }
      openTry(list[+el.dataset.i]);
    });
  };
  let rec = null;
  createRecorder($('tryRecorder'), { onChange: (r) => { rec = r; } });
  $('trySave').onclick = () => {
    if (!$('trySong').value.trim()) { toast('Name the song first'); return; }
    if (!rec) { toast('Record the rhythm first: tap along while the song plays'); return; }
    const words = syllables($('tryWords').value);
    if (words.length && words.length !== rec.length) { toast(`${words.length} syllables but ${rec.length} taps recorded. Record again, one tap per syllable.`); return; }
    if (!words.length && !$('tryHint').value.trim()) { toast('Type the sung words, or say what to tap'); return; }
    const t = { song: $('trySong').value.trim(), hint: $('tryHint').value.trim(), words: words.length ? words : null, rhythm: rec };
    saveTries([...loadTries(), t]); renderList(); openTry(t);
  };
  renderList();
}

const KIND_ICON = { number: '🔢', map: '📍', percent: '％', time: '⏱', color: '🎨', order: '↕', tempo: '🥁', circle: '⭕', country: '✏️', glass: '🍸', jar: '🫘', centre: '🎯', angle: '📐', maze: '🟢' };
function usePicker() {
  const sets = [...(data?.queue || []), ...(data?.backups || [])];
  if (!sets.length) return '<p class="hint">No sets in the queue.</p>';
  return sets.map((s) => `<div class="use-set"><div class="use-head"><b>${s.play_date ? 'Today' : s.is_backup ? 'Backup' : (s.expected_date ? fmtDate(s.expected_date, { weekday: 'short', day: 'numeric', month: 'short' }) : 'Queued')}</b> · ${esc(s.author)}</div>
    ${s.questions.map((q, k) => `<button type="button" class="use-q" data-use="${s.id}:${k}">${KIND_ICON[q.kind] || '❓'} ${esc(q.prompt)}</button>`).join('')}</div>`).join('');
}

// ---------- New challenge types (lab) ----------
const labParams = {};
let cleanup = null;   // stops a running challenge (e.g. the marble maze's animation)
function openLab(kind) {
  const c = LAB[kind];
  const p = labParams[kind] ||= Object.fromEntries(c.params.map((x) => [x.k, x.def]));
  const area = $('labArea');
  area.innerHTML = `<div class="card lab-card">
    <div class="tmp-step" style="text-align:left">Test question</div>
    <h2 id="labPrompt">${esc(c.prompt(p))}</h2>
    <div id="labPlay"></div>
    <div class="tmp-row" id="labBtns"><button type="button" class="btn ghost" id="labRedo">↻ Start over</button><button type="button" class="btn" id="labLock" disabled>Lock in ✓</button></div>
    <div id="labResult"></div>
    <details class="lab-settings"><summary>Settings</summary>
      ${c.params.map((x) => `<label class="field"><span>${esc(x.label)}</span>${x.options
        ? `<select class="input" data-k="${x.k}">${Object.entries(x.options).map(([v, n]) => `<option value="${v}"${v === p[x.k] ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>`
        : `<input class="input" type="number" step="${x.step}" data-k="${x.k}" value="${p[x.k]}">`}</label>`).join('')}
      <button type="button" class="btn ghost" id="labApply">Apply and play again</button>
    </details></div>
    <div class="card"><h2>Put this challenge in the quiz</h2>
      <p class="hint">Uses the settings above. Pick the question it should replace; you'll see the set in the editor first, then press Save. The replaced question is kept as a spare.</p>
      <div id="labUse">${usePicker()}</div></div>`;
  area.querySelectorAll('#labUse [data-use]').forEach((btn) => btn.onclick = () => {
    const [id, pos] = btn.dataset.use.split(':').map(Number);
    const set = findSet(id);
    const q = { kind, prompt: c.prompt(p), meta: c.meta(p), fact: '', source_url: '', image_url: '' };
    const questions = set.questions.map((x, k) => (k === pos ? q : x));
    openEditor({ ...set, questions });
    editing.replaced = { question: set.questions[pos], note: `replaced by ${c.title} in ${set.author}'s set` };
    toast('Challenge added to the set. Check it, then press Save.', true);
  });
  let answer = null;
  cleanup?.(); cleanup = null;
  const play = () => {
    cleanup?.(); cleanup = null;
    answer = null; $('labLock').disabled = true; $('labResult').innerHTML = ''; $('labBtns').style.display = '';
    $('labPrompt').textContent = c.prompt(p);
    cleanup = c.setup($('labPlay'), p, (a) => { answer = a; $('labLock').disabled = !a; }) || null;
  };
  $('labRedo').onclick = play;
  $('labLock').onclick = () => {
    if (!answer) return;
    cleanup?.(); cleanup = null;
    const r = c.score(p, answer);
    const { note, ...m } = r.metrics;
    $('labPlay').innerHTML = c.reveal(p, answer);
    $('labBtns').style.display = 'none';
    $('labResult').innerHTML = `<div class="lab-points">${fmtPts(r.points)}</div>
      <div class="lab-metrics">${Object.entries(m).map(([k, v]) => `<div><span class="muted">${esc(k)}</span><b>${esc(String(v))}</b></div>`).join('')}</div>
      ${note ? `<p class="hint" style="text-align:center">${esc(note)}</p>` : ''}
      <button type="button" class="btn block" id="labAgain">Play again</button>
      <details class="lab-raw"><summary>Raw answer (for debugging)</summary><pre>${esc(JSON.stringify(answer))}</pre></details>`;
    $('labAgain').onclick = play;
  };
  $('labApply').onclick = () => {
    area.querySelectorAll('.lab-settings [data-k]').forEach((i) => { const x = c.params.find((q) => q.k === i.dataset.k); p[x.k] = x.options ? i.value : +i.value; });
    play();
  };
  play();
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function openTry(t) {
  const area = $('tryArea');
  area.innerHTML = `<div class="card try-phone">
    <div class="qn">Test question</div>
    <div class="prompt">${esc(`Tap the rhythm of ${t.song}`)}</div>
    <div id="tryWidget"></div>
    <div id="tryResult"></div>
  </div>
  ${t.practice ? '' : `<div class="card"><h2>Put this song in the quiz</h2>
    <p class="hint">Pick the question it should replace. You'll see the set in the editor first, then press Save.</p>
    <div id="usePick">${usePicker()}</div></div>`}`;
  area.querySelectorAll('[data-use]').forEach((b) => b.onclick = () => {
    const [id, pos] = b.dataset.use.split(':').map(Number);
    const set = findSet(id);
    const questions = set.questions.map((q, k) => k !== pos ? q : {
      kind: 'tempo', prompt: `Tap the rhythm of ${t.song}`, items: t.rhythm, label: t.words ? '' : t.hint,
      words: t.words, tolerance: 0.5, fact: '', source_url: '', image_url: '',
    });
    openEditor({ ...set, questions });
    const old = set.questions[pos];
    if (old.kind !== 'tempo' || old.prompt !== questions[pos].prompt) {
      editing.replaced = { question: old, note: `replaced by ${t.title || t.song} in ${set.author}'s set` };
    }
    toast('Song added to the set. Check it, then press Save. The question it replaces is kept as a spare.', true);
  });
  createRhythm($('tryWidget'), {
    count: t.rhythm.length, hint: t.hint, words: t.words,
    onDone: (taps) => {
      const pts = rhythmPoints(t.rhythm, taps, 0.5);
      $('tryResult').innerHTML = `<div class="try-result">
        <div><span class="muted">Your speed</span><b>${Math.round(100 * t.rhythm[t.rhythm.length - 1] / Math.max(1, taps[taps.length - 1]))} %</b></div>
        <div><span class="muted">Points</span><b class="pts">${fmtPts(pts)}</b></div>
      </div>
      <div class="tl">${rhythmTimeline(t.rhythm, taps)}<p class="tl-verdict">${rhythmVerdict(t.rhythm, taps)}</p></div>
      <p class="hint" style="text-align:center">Speed doesn\u2019t count: your taps (green) are stretched to the real speed and only the timing is scored. Press "Change my answer" to try again.</p>`;
    },
  });
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- Office screen link + join-code check ----------
async function loadScreenCard() {
  const card = $('screenCard');
  try {
    const r = await admin('screen');
    const url = new URL(`./?screen=${r.screen_key}`, location.href).href;
    card.innerHTML = `<h2>Office screen</h2>
      <p class="hint">Use this address in the screen's web page template in Dise. It contains a secret key, so don't share it. The QR code on that screen carries a code that changes every day.</p>
      <div class="search"><input class="input num" id="screenUrl" readonly value="${esc(url)}"><button type="button" class="btn ghost" id="copyUrl">Copy</button></div>
      <div class="hint" style="font-size:15px">${r.seen_minutes_ago != null && r.seen_minutes_ago <= 15
        ? `<span style="color:var(--mint)">✓ The office screen is using this address</span> (last check-in ${r.seen_minutes_ago < 1 ? 'just now' : `${r.seen_minutes_ago} min ago`}).`
        : r.seen_minutes_ago != null
          ? `<span style="color:var(--gold)">⚠ The office screen last checked in with this address ${r.seen_minutes_ago} min ago.</span> It checks in every 10 minutes, so it may have stopped using it.`
          : '<span style="color:var(--danger)">✗ No screen has used this address yet.</span> Update the address in Dise and wait for the screen to reload.'}
        <button type="button" id="refreshScreen" style="border:0;background:none;color:var(--mint);text-decoration:underline;cursor:pointer;padding:0;font:inherit">Refresh</button></div>
      <div class="set" style="background:var(--panel-2)">
        <div class="head"><b>Join-code check: ${r.enforce ? '<span style="color:var(--mint)">ON</span>' : '<span style="color:var(--muted)">OFF</span>'}</b></div>
        <p class="hint">${r.enforce
          ? 'Only people who scanned today\u2019s QR code on the office screen can answer. Opening the quiz address without the key shows no QR code.'
          : 'Anyone with the quiz address can answer. Turn this on once the office screen uses the address above and shows a QR code.'}</p>
        <div class="actions"><button type="button" id="toggleEnforce">${r.enforce ? 'Turn off' : 'Turn on'}</button>
          <button type="button" id="newKey" class="danger">Make a new screen key</button></div>
      </div>`;
    $('copyUrl').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('Copied', true); } catch { $('screenUrl').select(); } };
    $('refreshScreen').onclick = () => loadScreenCard();
    $('toggleEnforce').onclick = async () => {
      const seen = r.seen_minutes_ago != null && r.seen_minutes_ago <= 15;
      if (!r.enforce && !confirm(seen
        ? 'Turn on the join-code check?'
        : 'The office screen has NOT checked in with the new address recently. If you turn the check on now, the screen will show no quiz. Turn it on anyway?')) return;
      try { await admin('set_enforce', { on: !r.enforce }); toast(r.enforce ? 'Check turned off' : 'Check turned on', true); loadScreenCard(); } catch (e) { toast(e.message); }
    };
    $('newKey').onclick = async () => {
      if (!confirm('Make a new key? The old screen address stops working, so you must update it in Dise straight away.')) return;
      try { await admin('new_screen_key'); toast('New key made. Update the address in Dise.', true); loadScreenCard(); } catch (e) { toast(e.message); }
    };
  } catch (e) { card.innerHTML = `<h2>Office screen</h2><p class="error">${esc(e.message)}</p>`; }
}

// ---------- Editing ----------
let editor = null;
function openEditor(set, backup, preload = null) {
  editing = { id: set?.id ?? null };
  show('edit');
  $('editTitle').textContent = set ? 'Edit set' : backup ? 'New backup set' : 'New set';
  $('editHint').textContent = set?.played
    ? 'People have already answered this set. If you change an answer, everyone’s points for it are recalculated.'
    : '';
  $('editAuthor').value = set?.author ?? (backup ? 'Quizbot' : '');
  $('editBackup').checked = set ? !!set.is_backup : !!backup;
  $('editBackup').disabled = !!set?.play_date;
  editor = createSetEditor($('editor'), { toast, lab: true });
  if (set) editor.load(set.questions);
  else if (preload) editor.load(preload);
}
// With answers hidden, tapping a blurred area of a question in the editor shows that question's answers.
$('editor').addEventListener('click', (e) => {
  if (spoilers) return;
  const card = e.target.closest('#editor > .card');
  if (card && !card.classList.contains('peek') && e.target.closest('[data-part], [data-f="more"]')) { card.classList.add('peek'); e.preventDefault(); }
}, true);
$('cancelEdit').onclick = () => show('main');
$('saveEdit').onclick = async () => {
  try {
    const questions = editor.collect();
    const author = $('editAuthor').value.trim();
    if (!author) throw new Error('Add an author name');
    await admin('save', { id: editing.id, author, questions, is_backup: $('editBackup').checked });
    let msg = 'Saved';
    if (editing.replaced) {
      try { await spares('add', editing.replaced); msg = 'Saved. The replaced question is in Backups → Spare questions.'; }
      catch (e) { msg = `Saved, but the replaced question couldn't be kept: ${e.message}`; }
    }
    if (editing.spareIds) { try { await spares('use', { ids: editing.spareIds }); } catch (e) { console.error(e); } }
    toast(msg, true);
    await load(); show('main');
  } catch (e) { toast(e.message); }
};

if (pass) tryLogin(); else show('login');
