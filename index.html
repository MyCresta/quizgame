<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballpark · Office screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="base.css">
<style>
  /* Sized for a 16:9 screen: everything scales with the viewport. */
  html { font-size: min(1.05vw, 1.87vh); }
  body { height: 100vh; overflow: hidden; }
  .screen { height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; gap: 1.6rem; padding: 2rem 2.4rem; }

  header { display: flex; align-items: center; justify-content: space-between; }
  header .logo { font-size: 3.6rem; }
  header .meta { text-align: right; white-space: nowrap; }
  #queueHint { margin-left: auto; margin-right: 2rem; }
  #queueHint .add-hint { font-size: 1.15rem; }
  #queueHint .qr-small { width: 4.4rem; height: 4.4rem; }
  header .date { font-size: 1.9rem; font-weight: 700; }
  header .sub { font-size: 1.15rem; color: var(--muted); }

  .main { display: grid; grid-template-columns: 1.6fr 1fr; gap: 1.6rem; min-height: 0; }
  .col { display: grid; gap: 1.2rem; min-height: 0; }
  .left { grid-template-rows: auto 1fr; }
  .right { grid-template-rows: auto 1fr; }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
  .section-title b { color: var(--ink); }

  .questions { display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 1rem; min-height: 0; }
  .q { background: var(--panel); border-radius: var(--radius); padding: 1.1rem 1.6rem; display: grid; grid-template-columns: 4.2rem 1fr; gap: 1.4rem; align-items: center; position: relative; overflow: hidden; min-height: 0; }
  .q.has-pic { padding-right: 17.5rem; }
  .q .pic { position: absolute; right: .9rem; top: .9rem; width: 15.5rem; height: calc(100% - 1.8rem); object-fit: cover; border-radius: 12px; background: var(--panel-2); }
  .q .pic.leaflet-container { background: #0d1b2a; }
  .q .pic .leaflet-control-attribution { font-size: 7px; }
  .q .n { font-size: 3.6rem; font-weight: 800; color: var(--accent); line-height: 1; text-align: center; }
  .q .prompt { min-width: 0; align-self: center; font-size: 1.95rem; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
  .q .prompt .tag { font-size: 1rem; vertical-align: .45em; margin-left: .3rem; white-space: nowrap; }

  .chip { background: var(--panel-2); border-radius: 999px; padding: .3rem .8rem; font-size: 1.05rem; font-weight: 600; animation: pop .4s ease; flex: none; display: inline-flex; gap: .45rem; align-items: baseline; }
  .chip .pos { color: var(--muted); font-size: .85em; }
  .chip b { color: var(--mint); }
  .chip:first-of-type .pos { color: var(--gold); }
  .chip.more { background: none; color: var(--muted); animation: none; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  .qr-card { background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 1rem 1.2rem; display: grid; grid-template-columns: auto 1fr; gap: 1.2rem; align-items: center; }
  .qr-card .qr { width: 7.5rem; height: 7.5rem; background: #fff; border-radius: 10px; padding: .5rem; display: grid; place-items: center; }
  .qr-card .qr svg, .qr-card .qr img { width: 100%; height: 100%; }
  .qr-card h2 { margin: 0; font-size: 2.1rem; line-height: 1; letter-spacing: -0.03em; }
  .qr-card p { margin: .35rem 0 0; font-size: 1.05rem; font-weight: 600; opacity: .75; }
  .qr-card .url { font-family: var(--mono); font-size: .85rem; margin-top: .4rem; word-break: break-all; opacity: .6; }

  .board { background: var(--panel); border-radius: var(--radius); padding: 1.3rem 1.5rem; display: grid; grid-template-rows: auto 1fr; gap: .8rem; min-height: 0; overflow: hidden; }
  .board table { width: 100%; border-collapse: collapse; font-size: 1.35rem; }
  .board td { padding: .42rem 0; border-bottom: 1px solid var(--line); }
  .board tr:last-child td { border-bottom: 0; }
  .board .rank { width: 2.6rem; font-weight: 800; color: var(--muted); }
  .board tbody tr:nth-child(1) .rank { color: var(--gold); }
  .board tbody tr:nth-child(2) .rank { color: #d9dde8; }
  .board tbody tr:nth-child(3) .rank { color: #e0a27a; }
  .board .name { font-weight: 700; }
  .board .today { color: var(--mint); font-size: 1.05rem; font-weight: 700; text-align: right; padding-right: 1.4rem; white-space: nowrap; }
  .board .today.none { color: var(--line); }
  .board .section-title .live { color: var(--mint); }
  .board th { font-size: .85rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; padding: 0 0 .2rem; text-align: right; }
  .board th.today { padding-right: 1.4rem; color: var(--muted); font-size: .85rem; }
  .board .pts { text-align: right; font-weight: 700; }
  #board { min-height: 0; overflow: hidden; }
  .empty { color: var(--muted); font-size: 1.3rem; align-self: center; text-align: center; padding: 1rem; }

  .results { display: grid; gap: 1rem; }
  .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; height: 11rem; }
  .r { background: var(--panel); border-radius: var(--radius); padding: 1.1rem 1.3rem; display: grid; grid-template-rows: auto auto 1fr; gap: .4rem; overflow: hidden; position: relative; }
  .r .rq { font-size: 1.05rem; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .ans { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; color: var(--gold); }
  .r .ans small { font-size: 1.2rem; color: var(--muted); font-weight: 600; margin-left: .3rem; }
  .r .best { font-size: 1.1rem; font-weight: 600; }
  .r .best b { color: var(--mint); }
  .r .fact { font-size: 1rem; color: var(--muted); align-self: end; }
  .r.map { grid-template-columns: 1fr 13rem; grid-template-rows: auto auto auto 1fr; column-gap: 1rem; }
  .r.map > :not(.mini) { grid-column: 1; }
  .r.map .ans { font-size: 1.7rem; }
  .r .mini { grid-column: 2; grid-row: 1 / -1; border-radius: 12px; overflow: hidden; }
  .r .mini .leaflet-control-attribution { font-size: 7px; }
  .winner { color: var(--gold); }

  .nothing { grid-column: 1 / -1; display: grid; place-items: center; text-align: center; background: var(--panel); border-radius: var(--radius); padding: 2rem; }
  .nothing h2 { font-size: 3.4rem; margin: 0 0 .6rem; letter-spacing: -0.03em; }
  .nothing p { font-size: 1.5rem; color: var(--muted); margin: 0; }

  .add-hint { display: flex; gap: .8rem; flex: none; white-space: nowrap; align-items: center; font-size: 1.05rem; color: var(--muted); }
  .add-hint .qr-small { width: 3.4rem; height: 3.4rem; background: #fff; border-radius: 8px; padding: .25rem; flex: none; }
  .add-hint .qr-small svg, .add-hint .qr-small img { width: 100%; height: 100%; }
  .add-hint b { color: var(--ink); }

  /* ===== Portrait (e.g. 1080×1920): stack the columns ===== */
  @media (orientation: portrait) {
    html { font-size: min(1.9vw, 1.07vh); }
    .screen { padding: 2.2rem 2rem; gap: 1.4rem; }
    header .logo { font-size: 3.4rem; }
    header .date { font-size: 1.8rem; }
    header .sub { display: none; }
    #queueHint { margin-right: 1.4rem; }
    #queueHint .add-hint { font-size: 1.05rem; }
    .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; gap: 1.4rem; }
    .q { padding: 1.1rem 1.4rem; }
    .q .prompt { font-size: 2.1rem; }
    .right { grid-template-columns: 14rem 1fr; grid-template-rows: 27rem; gap: 1.2rem; }
    .qr-card { grid-template-columns: 1fr; align-content: center; justify-items: center; text-align: center; gap: .9rem; padding: 1.2rem 1rem; }
    .qr-card .qr { width: 9rem; height: 9rem; }
    .qr-card h2 { font-size: 1.9rem; }
    .qr-card p { font-size: .95rem; }
    .qr-card .url { display: none; }
    .board table { font-size: 1.3rem; }
    .board td { padding: .32rem 0; }
    .results-grid { grid-template-columns: 1fr; grid-auto-rows: 7rem; height: auto; gap: .8rem; }
    .r { grid-template-columns: 1fr; grid-template-rows: auto auto auto; padding: .9rem 1.3rem; gap: .25rem; }
    .r .ans { font-size: 2.2rem; }
    .r .fact { display: none; }
    .r.map { grid-template-columns: 1fr 14rem; grid-template-rows: auto auto 1fr; }
    .r.map .ans { font-size: 1.8rem; }
    .nothing h2 { font-size: 3rem; }
  }

  .offline { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: .4rem 1rem; border-radius: 999px; font-size: 1rem; font-weight: 700; display: none; }
</style>
</head>
<body>
<div class="offline" id="offline">Reconnecting…</div>
<div class="screen">
  <header>
    <div class="logo" id="logo"></div>
    <div id="queueHint"></div>
    <div class="meta">
      <div class="date" id="date"></div>
      <div class="sub" id="sub"></div>
    </div>
  </header>

  <div class="main">
    <div class="col left">
      <div class="section-title"><span>Today's questions</span><span id="author"></span></div>
      <div class="questions" id="questions"></div>
    </div>
    <div class="col right">
      <div class="qr-card">
        <div class="qr" id="qr"></div>
        <div>
          <h2>Scan to play</h2>
          <p>Answer all three on your phone. Closest guesses score up to 10 000 points each.</p>
          <div class="url" id="playUrl"></div>
        </div>
      </div>
      <div class="board">
        <div class="section-title"><span id="boardTitle">Standings</span><span id="boardCols">points</span></div>
        <div id="board"></div>
      </div>
    </div>
  </div>

  <div class="results">
    <div class="section-title"><span id="resultsTitle">Yesterday's answers</span><span id="winner" class="winner"></span></div>
    <div class="results-grid" id="results"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module">
import { CONFIG } from './config.js';
import { rpc, fmt, fmtPts, fmtDate, esc, makeMap, lineMap, pin, dot, distanceKm, pageUrl } from './common.js';

const $ = (id) => document.getElementById(id);
$('logo').innerHTML = `${esc(CONFIG.title)}<span class="ball"></span>`;
document.title = `${CONFIG.title} · Office screen`;
$('sub').textContent = CONFIG.tagline;

function qrSvg(text) {
  if (typeof qrcode !== 'function') return `<div style="font:700 12px var(--mono);color:#000;text-align:center">QR unavailable</div>`;
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}
const playUrl = pageUrl('play.html');
const addUrl = pageUrl('add.html');
$('qr').innerHTML = qrSvg(playUrl);
$('playUrl').textContent = playUrl.replace(/^https?:\/\//, '');

let today = null;
let lastQuestionsKey = '';
let maps = [];
let qMaps = [];

function renderQuestions(t) {
  const qs = t.questions || [];
  const key = `${t.date}|${t.set_id}|${qs.length}|${qs.length ? '' : t.queued}`;
  if (key === lastQuestionsKey) return;   // only rebuild when the set changes (keeps maps/images steady)
  lastQuestionsKey = key;
  qMaps.forEach((m) => m.remove()); qMaps = [];
  if (!qs.length) {
    $('author').textContent = '';
    $('questions').innerHTML = `<div class="nothing">
      <div>
        <h2>${t.weekend ? 'It’s the weekend!' : 'The question queue is empty'}</h2>
        <p>${t.weekend ? 'New questions on Monday morning.' : 'Be the hero: add three questions for tomorrow.'}</p>
        <div class="add-hint" style="justify-content:center;margin-top:1.4rem"><div class="qr-small">${qrSvg(addUrl)}</div><span>Scan to <b>add a question set</b></span></div>
      </div></div>`;
    return;
  }
  $('author').innerHTML = `Questions by <b>${esc(t.author)}</b>`;
  $('questions').innerHTML = qs.map((q) => `
    <div class="q ${q.image_url || q.line ? 'has-pic' : ''}">
      <div class="n">${q.position}</div>
      <div class="prompt">${esc(q.prompt)} ${q.kind === 'map'
          ? '<span class="tag map">📍 Map</span>'
          : q.unit ? `<span class="tag number">in ${esc(q.unit)}</span>` : ''}</div>
      ${q.image_url ? `<img class="pic" src="${esc(q.image_url)}" alt="">` : q.line ? `<div class="pic" id="qline-${q.id}"></div>` : ''}
    </div>`).join('');
  if (typeof L !== 'undefined') {
    for (const q of qs.filter((x) => x.line && !x.image_url)) qMaps.push(lineMap($(`qline-${q.id}`), q.line));
  }
}

// Shrink long question texts until they fit inside their card.
function fitPrompts() {
  document.querySelectorAll('.q').forEach((card) => {
    const p = card.querySelector('.prompt');
    if (!p) return;
    p.style.fontSize = '';
    const cs = getComputedStyle(card);
    const avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let size = parseFloat(getComputedStyle(p).fontSize);
    const min = size * 0.55;
    while (p.scrollHeight > avail && size > min) { size *= 0.94; p.style.fontSize = `${size}px`; }
  });
}
document.fonts?.ready.then(fitPrompts);

// Nudge people to add questions when the queue runs low.
function renderQueueHint(t) {
  const qs = t.questions || [];
  $('queueHint').innerHTML = t.queued <= 1 && qs.length
    ? `<span class="add-hint"><span style="text-align:right">${t.queued ? 'Only 1 set left in the queue' : 'Queue is empty after today'}<br><b>Scan to add questions</b></span><span class="qr-small">${qrSvg(addUrl)}</span></span>`
    : '';
}

const portrait = () => matchMedia('(orientation: portrait)').matches;
function renderToday(t) {
  $('date').textContent = portrait() ? fmtDate(t.date, { weekday: 'short', day: 'numeric', month: 'short' }) : fmtDate(t.date);
  renderQuestions(t);
  renderQueueHint(t);
  requestAnimationFrame(fitPrompts);   // after everything above has settled the layout
}

function renderBoard(sb) {
  const live = CONFIG.showLivePoints;
  const month = new Date(`${sb.month}-15T12:00:00`).toLocaleDateString('en-GB', { month: 'long' });
  const played = sb.played_today || 0;
  $('boardTitle').textContent = `${month} standings`;
  $('boardCols').innerHTML = live ? (played ? `<span class="live">${played} played today</span>` : 'nobody yet today') : '';
  // Without live points, leave today's points out until tomorrow's reveal.
  const rows = (sb.rows || [])
    .map((r) => ({ ...r, total: live ? r.month_total : r.month_total - (r.today_total || 0) }))
    .filter((r) => r.total > 0)
    .sort((x, y) => y.total - x.total)
    .slice(0, CONFIG.scoreboardSize);
  if (!rows.length) {
    $('board').innerHTML = `<div class="empty">No points yet this month.<br>Scan the code and be the first!</div>`;
    return;
  }
  const head = `<thead><tr><th></th><th></th>${live ? '<th class="today">Today</th>' : ''}<th class="pts">${month.slice(0, 3)}</th></tr></thead>`;
  $('board').innerHTML = `<table>${head}<tbody>${rows.map((r, i) => `
    <tr><td class="rank">${i + 1}</td><td class="name">${esc(r.player)}</td>
    ${live ? `<td class="today num ${r.today_total ? '' : 'none'}">${r.today_total ? `+${fmt(r.today_total)}` : '–'}</td>` : ''}
    <td class="pts num">${fmt(r.total)}</td></tr>`).join('')}</tbody></table>`;
  fitBoard();
}

// Drop rows that don't fully fit, so the board never shows a half-cut row.
function fitBoard() {
  const box = $('board');
  const rows = box.querySelectorAll('tbody tr');
  for (let i = rows.length - 1; i > 0 && box.scrollHeight > box.clientHeight + 1; i--) rows[i].remove();
}
window.addEventListener('resize', () => { lastQuestionsKey = ''; safely(refreshAll); });

function renderResults(res) {
  maps.forEach((m) => m.remove()); maps = [];
  if (!res || !res.questions) {
    $('resultsTitle').textContent = 'Results';
    $('winner').textContent = '';
    $('results').innerHTML = `<div class="nothing"><p>Answers and points from today show up here tomorrow morning.</p></div>`;
    return;
  }
  $('resultsTitle').textContent = `Answers · ${fmtDate(res.date)}`;
  const top = res.players?.[0];
  $('winner').innerHTML = top
    ? `🏆 ${esc(top.player)} · <span class="num">${fmtPts(top.total)}</span> <span class="muted">(${res.players.length} played)</span>`
    : '<span class="muted">Nobody played</span>';
  $('results').innerHTML = res.questions.map((q) => {
    const b = q.best;
    if (q.kind === 'map') {
      const km = b ? distanceKm(q.answer_lat, q.answer_lng, b.lat, b.lng) : null;
      return `<div class="r map">
        <div class="rq">${q.position}. ${esc(q.prompt)}</div>
        <div class="ans">${esc(q.answer_label || 'See the map')}</div>
        <div class="best">${b ? `Closest: <b>${esc(b.player)}</b>, <span class="num">${fmt(Math.round(km))}</span> km away` : ''}</div>
        <div class="fact">${esc(q.fact || '')}</div>
        <div class="mini" id="mini-${q.id}"></div>
      </div>`;
    }
    return `<div class="r">
      <div class="rq">${q.position}. ${esc(q.prompt)}</div>
      <div class="ans num">${fmt(q.answer_num)}<small>${esc(q.unit || '')}</small></div>
      <div class="best">${b ? `Closest: <b>${esc(b.player)}</b> guessed <span class="num">${fmt(b.guess)}</span> · ${fmtPts(b.points)}` : ''}</div>
      <div class="fact">${esc(q.fact || '')}</div>
    </div>`;
  }).join('');

  if (typeof L === 'undefined') return;
  for (const q of res.questions.filter((x) => x.kind === 'map')) {
    const m = makeMap($(`mini-${q.id}`), { tiles: 'dark', interactive: false });
    const pts = [[q.answer_lat, q.answer_lng]];
    for (const p of res.players || []) {
      const g = p.guesses.find((x) => x.question_id === q.id);
      if (g && g.lat != null) { L.marker([g.lat, g.lng], { icon: dot('#5ee0b1', 9) }).addTo(m); pts.push([g.lat, g.lng]); }
    }
    L.marker([q.answer_lat, q.answer_lng], { icon: pin('#ffd166', 20) }).addTo(m);
    m.fitBounds(L.latLngBounds(pts).pad(0.3), { maxZoom: 6 });
    maps.push(m);
  }
}

async function refreshToday() {
  const [t, sb] = await Promise.all([rpc('quiz_today'), rpc('quiz_scoreboard')]);
  if (today && t.date !== today.date) { location.reload(); return; }
  today = t;
  renderToday(t);
  renderBoard(sb);
}

async function refreshAll() {
  const [t, sb, res] = await Promise.all([rpc('quiz_today'), rpc('quiz_scoreboard'), rpc('quiz_results')]);
  today = t;
  renderToday(t); renderBoard(sb); renderResults(res);
}

async function safely(fn) {
  try { await fn(); $('offline').style.display = 'none'; }
  catch (e) { console.error(e); $('offline').style.display = 'block'; }
}

safely(refreshAll);
setInterval(() => safely(refreshToday), 20_000);       // new answers + live scoreboard
setInterval(() => safely(refreshAll), 10 * 60_000);    // board + results
// Full reload a few times a day keeps a long-running TV browser healthy
setTimeout(() => location.reload(), 6 * 60 * 60_000);
</script>
</body>
</html>
